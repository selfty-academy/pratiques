<!-- Selfty Academy · code personnalisé BODY (SchoolMaker › Paramètres › Général › Code personnalisé › body)

     1. un onglet « Les pratiques » dans le menu du haut (et dans la barre du bas sur mobile), à gauche de Programmes ;
     2. en cliquant dessus, la page affiche le tableau des pratiques en plein écran (agenda de la semaine) ;

     5. sur les leçons du module 8 qui existent en audio, un bouton « 🎧 Écouter cette leçon en audio » sous la vidéo (page selfty-audio sur le VPS).

(function () {
  var OUVERTURE = '2026-10-19';
  var TABLEAU = 'https://187-77-169-11.sslip.io/pratiques/?embed=1&code=selfty2026';
  var PARAM = 'pratiques';
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function isAdmin() { return !!document.querySelector('a[href*="/school-admin"]'); }
  function visible() { return isAdmin() || today() >= OUVERTURE; }
  function actif() { return new URLSearchParams(location.search).get(PARAM) === '1'; }
  var ICON = '<svg class="mr-2 h-4 w-4" style="fill:currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M434.7 64h-85.9c-8 0-15.7 3-21.6 8.4l-98.3 90c-.1.1-.2.3-.3.4-16.6 15.6-16.3 40.5-2.1 56 12.7 13.9 39.4 17.6 56.1 2.7.1-.1.3-.1.4-.2l79.9-73.2c6.5-5.9 16.7-5.5 22.6 1 6 6.5 5.5 16.6-1 22.6l-26.1 23.9L504 313.8c2.9 2.4 5.5 5 7.9 7.7V128l-54.6-54.6c-5.9-6-14.1-9.4-22.6-9.4zM544 128.2v223.9c0 17.7 14.3 32 32 32h64V128.2h-96zm48 223.9c-8.8 0-16-7.2-16-16s7.2-16 16-16 16 7.2 16 16-7.2 16-16 16zM0 384h64c17.7 0 32-14.3 32-32V128.2H0V384zm48-63.9c8.8 0 16 7.2 16 16s-7.2 16-16 16-16-7.2-16-16c0-8.9 7.2-16 16-16zm435.9 18.6L334.6 217.5l-30 27.5c-29.7 27.1-75.2 24.5-101.7-4.4-26.9-29.4-24.8-74.9 4.4-101.7L289.1 64h-83.8c-8.5 0-16.6 3.4-22.6 9.4L128 128v223.9h18.3l90.5 81.9c27.4 22.3 67.7 18.1 90-9.3l.2-.2 17.9 15.5c15.9 13 39.4 10.5 52.3-5.4l31.4-38.6 5.4 4.4c13.7 11.1 33.9 9.1 45-4.7l9.5-11.7c11.2-13.8 9.1-33.9-4.6-45.1z"/></svg>';
  var ICON_M = '<svg class="w-5 h-5 mb-1" style="fill:currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M434.7 64h-85.9c-8 0-15.7 3-21.6 8.4l-98.3 90c-.1.1-.2.3-.3.4-16.6 15.6-16.3 40.5-2.1 56 12.7 13.9 39.4 17.6 56.1 2.7.1-.1.3-.1.4-.2l79.9-73.2c6.5-5.9 16.7-5.5 22.6 1 6 6.5 5.5 16.6-1 22.6l-26.1 23.9L504 313.8c2.9 2.4 5.5 5 7.9 7.7V128l-54.6-54.6c-5.9-6-14.1-9.4-22.6-9.4zM544 128.2v223.9c0 17.7 14.3 32 32 32h64V128.2h-96zm48 223.9c-8.8 0-16-7.2-16-16s7.2-16 16-16 16 7.2 16 16-7.2 16-16 16zM0 384h64c17.7 0 32-14.3 32-32V128.2H0V384zm48-63.9c8.8 0 16 7.2 16 16s-7.2 16-16 16-16-7.2-16-16c0-8.9 7.2-16 16-16zm435.9 18.6L334.6 217.5l-30 27.5c-29.7 27.1-75.2 24.5-101.7-4.4-26.9-29.4-24.8-74.9 4.4-101.7L289.1 64h-83.8c-8.5 0-16.6 3.4-22.6 9.4L128 128v223.9h18.3l90.5 81.9c27.4 22.3 67.7 18.1 90-9.3l.2-.2 17.9 15.5c15.9 13 39.4 10.5 52.3-5.4l31.4-38.6 5.4 4.4c13.7 11.1 33.9 9.1 45-4.7l9.5-11.7c11.2-13.8 9.1-33.9-4.6-45.1z"/></svg>';

  // 5. Leçons en audio (téléphone dans la poche) : bouton sous la vidéo des leçons du module 8 qui existent en audio
  var AUDIO_BASE = 'https://187-77-169-11.sslip.io/selfty-audio/ecoute-273a530663d2/';
  var AUDIO = {"ce4c6fe6-df77-4579-86a8-ca6563820330": 1, "d6f8dc5b-eaa9-43ad-adff-b93ed0060984": 2, "b6b5250d-b6ca-4f9b-9bf1-ab455c98a9e4": 3, "cbb20736-8ba2-417b-b5d9-a1ad25f26d1a": 4, "2ef086b4-a2dd-477b-ac57-f06d7862e22c": 5, "7961c93b-0ea2-4ea0-9072-75dbc4a2c5ab": 6, "58fdf756-e820-4780-997b-799f3a14474f": 7, "78710025-d7ad-4207-abe0-90c6c1769e3a": 8, "52fc8bea-6e84-4f33-aed6-5e946749c95f": 9};
  function boutonAudio() {
    var m = location.pathname.match(/^\/lessons\/([0-9a-f-]{36})/);
    if (!m || !AUDIO[m[1]] || document.getElementById('sm-audio-btn')) return;
    var media = document.querySelector('iframe[src*="mediadelivery"], audio');
    if (!media) return;
    var host = media.closest('[data-controller="lesson-video-seek"]') || media.parentElement;
    var wrap = document.createElement('div');
    wrap.id = 'sm-audio-btn'; wrap.style.cssText = 'margin:14px 0 4px;text-align:center';
    wrap.innerHTML = '<a href="' + AUDIO_BASE + '#' + m[1] + '" target="_blank" rel="noopener" style="display:inline-block;background:#5D2B4A;color:#fff;text-decoration:none;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px">🎧 Écouter cette leçon en audio</a>'
      + '<div style="margin-top:6px;font-size:13px;color:#8a7a7a">Le son continue téléphone verrouillé, dans la poche.</div>';
    host.insertAdjacentElement('afterend', wrap);
  }

  function run() {
    boutonAudio();
    // 3. Consultations masquées partout (menu haut, barre mobile, menu du profil)
    document.querySelectorAll('a[href^="/consultations"]').forEach(function (a) { a.style.display = 'none'; });
    if (!visible()) return;
    var on = actif();
    // 1. onglet dans le menu du haut (desktop)
    var prod = document.querySelector('nav a[href="/products"]');
    if (prod && !document.getElementById('sm-pratiques')) {
      var a = document.createElement('a');
      a.id = 'sm-pratiques'; a.href = '/products?' + PARAM + '=1'; a.setAttribute('data-turbo', 'true');
      a.className = prod.className.replace('border-primary-500', 'border-transparent');
      a.innerHTML = ICON + 'Les pratiques';
      prod.parentNode.insertBefore(a, prod);
    }
    // 1 bis. barre du bas (mobile)
    var prodM = document.querySelector('a.w-full[href="/products"]');
    if (prodM && !document.getElementById('sm-pratiques-m')) {
      var m = document.createElement('a');
      m.id = 'sm-pratiques-m'; m.href = '/products?' + PARAM + '=1'; m.className = prodM.className;
      m.innerHTML = ICON_M + '<span class="text-xs">Pratiques</span>';
      prodM.parentNode.insertBefore(m, prodM);
    }
    // état actif du menu
    var mine = document.getElementById('sm-pratiques');
    if (mine && prod) {
      if (on) { mine.className = prod.className.replace('border-transparent', 'border-primary-500'); prod.className = prod.className.replace('border-primary-500', 'border-transparent'); }
    }
    // 2. la page : le tableau en plein écran
    if (on && !document.getElementById('sm-pratiques-frame')) {
      var main = document.querySelector('main');
      if (main) {
        main.innerHTML = '<div style="width:100%;max-width:1100px;margin:0 auto;padding:8px 8px 0;position:relative">'
          + '<div id="sm-pratiques-wait" style="position:absolute;left:0;right:0;top:120px;text-align:center;color:#8a7a7a;font-size:15px">Un instant, on ouvre le tableau des pratiques…</div>'
          + '<iframe id="sm-pratiques-frame" src="' + TABLEAU + '" title="Les pratiques" style="position:relative;width:100%;height:calc(100vh - 110px);min-height:640px;border:0;border-radius:14px;background:transparent" allow="clipboard-write"></iframe></div>';
        var fr = document.getElementById('sm-pratiques-frame'), wait = document.getElementById('sm-pratiques-wait');
        fr.addEventListener('load', function () { if (wait) wait.remove(); });
        setTimeout(function () { if (wait && wait.parentNode) wait.remove(); }, 8000);
        // hauteur = tout l'écran restant, moins la barre du bas de SchoolMaker sur mobile (sinon elle cache les onglets du tableau)
        var fit = function () {
          var f = document.getElementById('sm-pratiques-frame'); if (!f) return;
          var barA = document.querySelector('a.w-full[href="/products"]');
          var bar = barA ? barA.closest('nav') || barA.parentElement.parentElement : null;
          var barH = (bar && bar.offsetParent !== null && getComputedStyle(bar).position === 'fixed') ? bar.getBoundingClientRect().height : 0;
          var h = window.innerHeight - f.getBoundingClientRect().top - barH - 6;
          f.style.height = Math.max(420, h) + 'px'; f.style.minHeight = '0';
        };
        fit(); setTimeout(fit, 300); window.addEventListener('resize', fit);
        document.title = 'Les pratiques - Selfty Academy';
      }
    }
  }
  run();
  document.addEventListener('turbo:load', run);
  document.addEventListener('turbo:render', run);
  document.addEventListener('turbo:frame-load', run);
})();
</script>
